<script>
fetch("locations.json")
.then(res => res.json())
.then(data => {

    // ambil id dari URL
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get("id");

    // cari data sesuai id
    const item = data.find(d => d.id === id);

    document.title =
    `Filming In Jakarta - ${item.title}`;

    // fallback kalau tidak ada id
    if (!item) {
        console.warn("ID tidak ditemukan, pakai data pertama");
        item = data[0];
    }

    // TITLE
    document.querySelector(".title-asset").innerText = item.title;
    document.querySelector(".bread").innerText = item.title;

    // DESCRIPTION
    document.querySelector(".desc-asset").innerText = item.description;

    // AREA
    document.getElementById("area-size").innerHTML = `
        <strong style="color:#ff5a1f;">Area Size</strong><br>
        ${item.area}
    `;

    // FACILITIES
    document.getElementById("facility").innerHTML = `
        <strong style="color:#ff5a1f;">Facility</strong><br>
        ${item.facilities.join(", ")}
    `;

    // MAP
    document.querySelector(".map-section iframe").src = item.map;

    // GALLERY
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    fetch(item.gallery + "gallery.json")
    .then(res => res.json())
    .then(images => {
        images.forEach(file => {
            const src = item.gallery + file;

            const div = document.createElement("div");
            div.className = "gallery-item";
            div.innerHTML = `<img src="${src}" class="gallery-img" data-full="${src}">`;

            gallery.appendChild(div);
        });
         initLightbox();
    });

})
    .catch(err => console.error("ERROR:", err));

        var swiper = new Swiper(".mySwiper", {
            slidesPerView: 1,
            spaceBetween: 10,
            loop: true,
            pagination: {
                el: ".swiper-pagination",
                dynamicBullets: true,
            },
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
        });


    function initLightbox() {

        const images = document.querySelectorAll(".gallery-img");
        const modal = document.getElementById("lightbox-modal");
        const modalImg = modal.querySelector("img");
        const closeBtn = modal.querySelector(".close-btn");
        const nextBtn = modal.querySelector(".next");
        const prevBtn = modal.querySelector(".prev");
        const counter = modal.querySelector(".image-counter");

        let currentIndex = 0;

        function showImage(index) {
            modalImg.src = images[index].dataset.full;
            counter.textContent = (index + 1) + " / " + images.length;
        }

        images.forEach((img, index) => {
            img.addEventListener("click", () => {
                currentIndex = index;
                modal.style.display = "block";
                showImage(index);
            });
        });

        closeBtn.onclick = () => modal.style.display = "none";

        nextBtn.onclick = () => {
            currentIndex = (currentIndex + 1) % images.length;
            showImage(currentIndex);
        };

        prevBtn.onclick = () => {
            currentIndex = (currentIndex - 1 + images.length) % images.length;
            showImage(currentIndex);
        };

        document.addEventListener("keydown", (e) => {
            if (modal.style.display === "block") {
                if (e.key === "Escape") modal.style.display = "none";
                if (e.key === "ArrowRight") nextBtn.click();
                if (e.key === "ArrowLeft") prevBtn.click();
            }
        });
    }

    window.dataLayer = window.dataLayer || [];

     function gtag() {
         dataLayer.push(arguments);
     }
     gtag('js', new Date());

     gtag('config', 'G-V0S9GRM6LS');
</script>
