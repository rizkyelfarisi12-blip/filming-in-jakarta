<script>    
    let currentFilter = "all";

    function filterCategory(category) {
        currentFilter = category;
        initPagination();
    }


    function initPagination() {

    const allItems = document.querySelectorAll('.item');
    const items = [];

    allItems.forEach(item => {
        if (currentFilter === "all" || item.dataset.category === currentFilter) {
            item.style.display = '';
            items.push(item);
        } else {
            item.style.display = 'none';
        }
    });

    const perPage = 6;
    const pageCount = Math.ceil(items.length / perPage);
    const pagination = document.getElementById('pagination-controls');

    let currentPage = 1;

    function showPage(page) {
        currentPage = page;

        items.forEach((item, index) => {
            item.style.display = (index >= (page-1)*perPage && index < page*perPage) ? '' : 'none';
        });

        renderControls();
    }

    function renderControls() {
        pagination.innerHTML = '';

        const prev = document.createElement('button');
        prev.innerText = 'Prev';
        prev.disabled = currentPage === 1;
        prev.onclick = () => showPage(currentPage - 1);
        pagination.appendChild(prev);

        for (let i = 1; i <= pageCount; i++) {
            const btn = document.createElement('button');
            btn.innerText = i;
            if (i === currentPage) btn.classList.add('active');
            btn.onclick = () => showPage(i);
            pagination.appendChild(btn);
        }

        const next = document.createElement('button');
        next.innerText = 'Next';
        next.disabled = currentPage === pageCount;
        next.onclick = () => showPage(currentPage + 1);
        pagination.appendChild(next);
    }

    showPage(1);
    }


    document.addEventListener('DOMContentLoaded', initPagination);

    const categoryItems = document.querySelectorAll('.category-item');

    categoryItems.forEach(item => {
        item.addEventListener('click', function() {
            categoryItems.forEach(i => i.classList.remove('active'));
            this.classList.add('active');
        });
    });


    fetch('card-location.json')
    .then(res => res.json())
    .then(data => {

        const container = document.getElementById('asset-list');

        data.forEach(item => {

            const col = document.createElement('div');
            col.className = 'col-md-4 item';
            col.setAttribute('data-category', item.category);

            col.innerHTML = `
                <a href="${item.link}">
                    <div class="project-wrap">
                        <div class="img" style="background-image:url(${item.image})">
                            <span class="tag">${item.category}</span>
                        </div>
                        <div class="location-box">
                            <h5 style="color: white; font-weight: bold;">${item.title}</h5>
                            <small><i class="fa fa-map-marker"></i> ${item.location}</small>
                        </div>
                    </div>
                </a>
            `;

            container.appendChild(col);
        });

        initPagination(); // penting biar pagination tetap jalan
    });
</script>
